<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app" aria-busy="false">
      <header class="header">
        <h1 class="title">Currency Converter</h1>
        <p class="subtitle" id="rateMeta" aria-live="polite">Loading rates&hellip;</p>
      </header>

      <section class="row amount-row">
        <label for="amount" class="label">Amount</label>
        <input
          id="amount"
          class="input amount"
          type="number"
          inputmode="decimal"
          step="any"
          min="0"
          value="1"
          autocomplete="off"
          spellcheck="false"
        />
      </section>

      <section class="row pair-row">
        <div class="field">
          <label for="from" class="label">From</label>
          <select id="from" class="input select" disabled>
            <option>Loading&hellip;</option>
          </select>
        </div>

        <button
          id="swap"
          class="swap"
          type="button"
          title="Swap currencies"
          aria-label="Swap currencies"
          disabled
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M7 7h11l-3-3 1.4-1.4L21.8 7.8 16.4 13.2 15 11.8 18 8.8H7V7zm10 10H6l3 3-1.4 1.4L2.2 16.2l5.4-5.4L9 12.2 6 15.2h11V17z"
            />
          </svg>
        </button>

        <div class="field">
          <label for="to" class="label">To</label>
          <select id="to" class="input select" disabled>
            <option>Loading&hellip;</option>
          </select>
        </div>
      </section>

      <section class="result" aria-live="polite">
        <div class="result-value" id="resultValue">&mdash;</div>
        <div class="result-rate" id="resultRate"></div>
      </section>

      <p class="error" id="error" role="alert" hidden></p>

      <footer class="footer">
        <span>Rates from <a href="https://www.frankfurter.app" target="_blank" rel="noopener">Frankfurter</a> (ECB, daily)</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
